name: dbt CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ./cloud_logistics_dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt
        run: |
          pip install dbt-core==1.11.8 dbt-snowflake==1.11.4

      - name: Create dbt profile
        run: |
          mkdir -p cloud_logistics_dbt
          echo "cloud_logistics_dbt:" > cloud_logistics_dbt/profiles.yml
          echo "  target: dev" >> cloud_logistics_dbt/profiles.yml
          echo "  outputs:" >> cloud_logistics_dbt/profiles.yml
          echo "    dev:" >> cloud_logistics_dbt/profiles.yml
          echo "      type: snowflake" >> cloud_logistics_dbt/profiles.yml
          echo "      account: ${{ secrets.SNOWFLAKE_ACCOUNT }}" >> cloud_logistics_dbt/profiles.yml
          echo "      user: ${{ secrets.SNOWFLAKE_USER }}" >> cloud_logistics_dbt/profiles.yml
          echo "      password: ${{ secrets.SNOWFLAKE_PASSWORD }}" >> cloud_logistics_dbt/profiles.yml
          echo "      role: ACCOUNTADMIN" >> cloud_logistics_dbt/profiles.yml
          echo "      database: LOGISTICS_DB" >> cloud_logistics_dbt/profiles.yml
          echo "      warehouse: COMPUTE_WH" >> cloud_logistics_dbt/profiles.yml
          echo "      schema: GOLD" >> cloud_logistics_dbt/profiles.yml
          echo "      threads: 1" >> cloud_logistics_dbt/profiles.yml

      - name: dbt debug
        working-directory: cloud_logistics_dbt
        run: dbt debug

      - name: dbt run
        working-directory: cloud_logistics_dbt
        run: dbt run

      - name: dbt test
        working-directory: cloud_logistics_dbt
        run: dbt test
